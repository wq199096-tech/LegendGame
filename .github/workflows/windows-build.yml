name: windows-build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build (all targets)
        run: cmake --build build --config Debug --parallel

      # 阶段24 指令四十七：Client 冒烟需要 OpenGL 3.3——GitHub Windows runner 只有
      # GDI Generic 1.1，装 Mesa llvmpipe 软件渲染（环境配置步骤；门禁本身不弱化）。
      - name: Install software OpenGL (Mesa llvmpipe) for client smoke
        shell: pwsh
        run: |
          $ver = '26.2.3'
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$ver/mesa3d-$ver-release-msvc.7z"
          $zip = "$env:RUNNER_TEMP/mesa.7z"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = '7z' }
          & $sevenZip x $zip "-o$env:RUNNER_TEMP/mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error 'mesa extract failed'; exit 1 }
          $dst = 'build/bin/Debug'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$env:RUNNER_TEMP/mesa/x64/opengl32.dll" $dst -Force
          Copy-Item "$env:RUNNER_TEMP/mesa/x64/lib*.dll" $dst -Force
          Get-ChildItem $dst -Filter *.dll | ForEach-Object { Write-Host $_.Name }
          Write-Host 'MESA SOFTWARE GL INSTALLED'

      - name: Verify artifacts (8 formal + 3 test executables)
        shell: pwsh
        run: |
          $exes = @(
            'build/bin/Debug/LegendClient.exe',
            'build/bin/Debug/LegendMapEditor.exe',
            'build/bin/Debug/LegendGateway.exe',
            'build/bin/Debug/LegendLoginServer.exe',
            'build/bin/Debug/LegendWorldServer.exe',
            'build/bin/Debug/LegendCharacterServer.exe',
            'build/bin/Debug/LegendDbServer.exe',
            'build/bin/Debug/LegendLogServer.exe',
            'build/bin/Debug/LegendNetworkTests.exe',
            'build/bin/Debug/LegendAccountTests.exe',
            'build/bin/Debug/LegendWorldTests.exe'
          )
          foreach ($exe in $exes) {
            if (-not (Test-Path $exe)) { Write-Error "$exe missing"; exit 1 }
          }
          Write-Host 'NETWORK BUILD PASS'
          Write-Host 'ACCOUNT BUILD PASS'
          Write-Host 'WORLD BUILD PASS'
          Write-Host 'VERIFY 11 EXECUTABLES PASS (8 FORMAL + 3 TEST)'

      # 阶段9.3指令三十一 + 阶段10指令一百零七 + 阶段11指令一百一十三：
      # CTest Runtime 硬门禁（禁止 continue-on-error）
      # 阶段19：输出落盘 + 失败时上传日志 artifact（公开仓库可匿名下载排查）。
      - name: Run runtime tests (CTest hard gate)
        shell: pwsh
        run: |
          ctest --test-dir build -C Debug --output-on-failure 2>&1 | Tee-Object -FilePath ctest.log
          $code = $LASTEXITCODE
          exit $code
      - name: Upload test log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: ctest.log
          if-no-files-found: warn
      - name: Emit failure diagnostics (annotations)
        if: failure()
        shell: pwsh
        run: |
          # 注解 API 公开可读（无 token 排查通道）：FAILED 测试名 + FAIL 检查行。
          $log = Get-Content ctest.log
          $inFailed = $false
          $count = 0
          foreach ($line in $log) {
            if ($line -match 'The following tests FAILED:') { $inFailed = $true; continue }
            if ($inFailed -and $count -lt 6) {
              if ($line.Trim().Length -gt 0) {
                Write-Host "::error::$($line.Trim())"
                ++$count
              }
              if ($line -match 'tests (failed|passed)') { break }
            }
          }
          $fails = $log | Select-String '^\[FAIL\]' | Select-Object -Last 10
          foreach ($f in $fails) {
            Write-Host "::error::$($f.Line.Substring(0, [Math]::Min(220, $f.Line.Length)))"
          }
          # 诊断行（测试内 [Diag] printf）：失败定位通道。
          $diag = $log | Select-String '\[Diag\]' | Select-Object -Last 30
          foreach ($d in $diag) {
            Write-Host "::error::$($d.Line.Substring(0, [Math]::Min(220, $d.Line.Length)))"
          }
          $tail = $log | Select-Object -Last 12
          foreach ($line in $tail) {
            Write-Host "::error::$($line.Substring(0, [Math]::Min(220, $line.Length)))"
          }
      - name: Runtime gate result
        shell: pwsh
        run: |
          if (Select-String -Path ctest.log -Pattern 'tests failed|tests passed but with|errors while running' -Quiet) {
            Write-Error 'Runtime tests failed'; exit 1
          }
          $last = Select-String -Path ctest.log -Pattern 'tests passed' | Select-Object -Last 1
          if (-not $last) { Write-Error 'Runtime tests failed (no summary)'; exit 1 }
          Write-Host $last.Line
          Write-Host 'NETWORK RUNTIME TEST PASS'
          Write-Host 'ACCOUNT RUNTIME TEST PASS'
          Write-Host 'WORLD RUNTIME TEST PASS'

      - name: Server topology smoke (6 services, heartbeat window)
        shell: pwsh
        run: |
          $bin = 'build/bin/Debug'
          $processes = @()
          try {
            foreach ($name in @('LegendDbServer','LegendLogServer','LegendLoginServer','LegendCharacterServer','LegendWorldServer','LegendGateway')) {
              # Stage25.6：exe 改 GUI 子系统，CI 无人值守必须显式 --console
              $processes += Start-Process -FilePath "$bin/$name.exe" -ArgumentList '--config','Config/servers.json','--console' -WorkingDirectory . -PassThru
            }
            $ports = @(7500,7600,7100,7400,7200,7300)
            $deadline = (Get-Date).AddSeconds(30)
            do {
              $ready = $true
              foreach ($port in $ports) {
                $tcp = [System.Net.Sockets.TcpClient]::new()
                try { $tcp.Connect('127.0.0.1',$port) } catch { $ready = $false } finally { $tcp.Dispose() }
              }
              if (-not $ready) { Start-Sleep -Milliseconds 250 }
            } until ($ready -or (Get-Date) -ge $deadline)
            if (-not $ready) { Write-Error 'Topology ports did not become ready'; exit 1 }
            $holdUntil = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $holdUntil) {
              foreach ($proc in $processes) { if ($proc.HasExited) { Write-Error "service pid $($proc.Id) exited"; exit 1 } }
              Start-Sleep -Milliseconds 500
            }
            Write-Host 'SERVER TOPOLOGY SMOKE PASS'
          } finally {
            foreach ($proc in $processes) { if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } }
          }

      # Stage25.5: full topology + Client vertical slice.
      # 验证 world-ready 与干净退出（禁止删测试/弱化门禁——独立硬步骤）。
      - name: Vertical Slice runtime smoke (full 7-process chain)
        shell: pwsh
        run: |
          # 失败诊断：dump 客户端与各服务器日志尾部（不改变任何断言强度）
          function Dump-SmokeLogs([string]$reason) {
            Write-Host "==== VsSmoke failure diagnostics: $reason ===="
            foreach ($f in @('Logs/latest.log','Logs/Gateway/latest.log','Logs/World/latest.log','Logs/Character/latest.log','Logs/Login/latest.log','Logs/Db/latest.log','Logs/Log/latest.log')) {
              if (Test-Path $f) {
                Write-Host "---- $f (last 30 lines) ----"
                Get-Content $f -Tail 30 | ForEach-Object { Write-Host $_ }
              } else {
                Write-Host "---- $f : MISSING ----"
              }
            }
          }
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $env:LEGEND_CLIENT_AUTO_ENTER = '1'
          $env:LEGEND_CLIENT_VS_SMOKE = '1'
          $bin = 'build/bin/Debug'
          Remove-Item Logs/latest.log -ErrorAction SilentlyContinue
          $db = Start-Process -FilePath "$bin/LegendDbServer.exe" -ArgumentList '--config','Config/servers.json','--console' -WorkingDirectory . -PassThru
          $logServer = Start-Process -FilePath "$bin/LegendLogServer.exe" -ArgumentList '--config','Config/servers.json','--console' -WorkingDirectory . -PassThru
          $login = Start-Process -FilePath "$bin/LegendLoginServer.exe" -ArgumentList '--config','Config/servers.json','--console' -WorkingDirectory . -PassThru
          $character = Start-Process -FilePath "$bin/LegendCharacterServer.exe" -ArgumentList '--config','Config/servers.json','--console' -WorkingDirectory . -PassThru
          $world = Start-Process -FilePath "$bin/LegendWorldServer.exe" -ArgumentList '--config','Config/servers.json','--console' -WorkingDirectory . -PassThru
          $gateway = Start-Process -FilePath "$bin/LegendGateway.exe" -ArgumentList '--config','Config/servers.json','--console' -WorkingDirectory . -PassThru
          try {
            $ports = @(7500,7600,7100,7400,7200,7300)
            $readyDeadline = (Get-Date).AddSeconds(30)
            do {
              $ready = $true
              foreach ($port in $ports) {
                $tcp = [System.Net.Sockets.TcpClient]::new()
                try { $tcp.Connect('127.0.0.1',$port) } catch { $ready = $false } finally { $tcp.Dispose() }
              }
              if (-not $ready) { Start-Sleep -Milliseconds 250 }
            } until ($ready -or (Get-Date) -ge $readyDeadline)
            if (-not $ready) {
              Dump-SmokeLogs 'full topology readiness timeout (30s)'
              Write-Error 'Full topology readiness failed'; exit 1
            }
            $client = Start-Process -FilePath "$bin/LegendClient.exe" -WorkingDirectory . -PassThru
            $deadline = (Get-Date).AddSeconds(150)
            while ((Get-Date) -lt $deadline -and -not $client.HasExited) {
              Start-Sleep -Seconds 5
            }
            if (-not $client.HasExited) {
              Dump-SmokeLogs 'client did not exit within 150s budget'
              Stop-Process -Id $client.Id -Force
              Write-Error 'VsSmoke client did not exit within budget'
              exit 1
            }
            if ($client.ExitCode -ne 0) {
              Dump-SmokeLogs "client exited with code $($client.ExitCode)"
              Write-Error "VsSmoke client exit code $($client.ExitCode)"
              exit 1
            }
            $log = Get-Content Logs/latest.log -Raw -ErrorAction SilentlyContinue
            if (-not $log) { Dump-SmokeLogs 'client log missing'; Write-Error 'VsSmoke: log missing'; exit 1 }
            if ($log -notmatch '\[VsSmoke\] entered-world') {
              Dump-SmokeLogs 'entered-world marker missing (auto login -> world ready failed)'
              Write-Error 'VsSmoke entered-world marker missing (auto login -> world ready failed)'
              exit 1
            }
            if ($log -notmatch '\[VsSmoke\] pass') {
              Dump-SmokeLogs 'pass marker missing (30s alive clean quit)'
              Write-Error 'VsSmoke pass marker missing (30s alive clean quit)'
              exit 1
            }
            Write-Host 'VERTICAL SLICE RUNTIME SMOKE PASS (db/log/login/character/world/gateway/client)'
          } finally {
            foreach ($proc in @($gateway, $world, $character, $login, $logServer, $db)) {
              if ($proc -and -not $proc.HasExited) {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }
